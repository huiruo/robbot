name: Release desktop app

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Forge's GitHub publisher reuses the same draft release for each OS.
      # Serializing the matrix avoids two jobs creating/uploading it at once.
      max-parallel: 1
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Rewrite git SSH URLs to HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install renderer dependencies
        run: npm ci --prefix apps/desktop/renderer

      - name: Publish draft GitHub Release
        run: pnpm --filter @robbot/desktop run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
