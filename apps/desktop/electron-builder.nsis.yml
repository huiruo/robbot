appId: com.robbot.desktop
productName: Robbot
copyright: Copyright © 2026 huiruo

directories:
  output: out/nsis

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Robbot
  runAfterFinish: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: Robbot-Setup-${version}-${arch}.${ext}
